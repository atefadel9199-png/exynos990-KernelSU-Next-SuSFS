name: Build S20+ G985F Hide Peer 50
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: sudo apt-get update && sudo apt-get install -y bc bison flex zip lz4 libssl-dev libelf-dev python3 cpio curl git build-essential
      - name: Toolchains
        run: |
          export GIT_TERMINAL_PROMPT=0
          mkdir -p ../tc
          (rm -rf ../tc/clang10 && git clone --depth=1 https://gitlab.com/crdroidandroid/android_prebuilts_clang_host_linux-x86_clang-r370808.git ../tc/clang10) || (rm -rf ../tc/clang10 && git clone --depth=1 https://github.com/LineageOS/android_prebuilts_clang_kernel_linux-x86_clang-r416183b.git ../tc/clang10) || (rm -rf ../tc/clang10 && git clone --depth=1 https://github.com/kdrag0n/proton-clang.git ../tc/clang10)
          rm -rf ../tc/gcc49 && git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git ../tc/gcc49
      - name: Patch Peer 50
        run: |
          python3 - << 'PY'
          import re
          p = "fs/proc_namespace.c"
          s = open(p).read()
          ns, n = re.subn(r'(seq_printf\s*\(\s*m\s*,\s*" shared:%[id]"\s*,\s*([^;]+?)\s*\);)', r'{ if ((\2) < 50) \1 }', s)
          assert n > 0, "TARGET_NOT_FOUND"
          open(p, "w").write(ns)
          print("PATCH_OK:", n)
          PY
      - name: Build
        run: |
          cat boot_part_* > boot.img
          EXT=$(find . -maxdepth 4 \( -iname "*extract*firmware*.py" -o -iname "*extract*boot*.py" \) | head -n 1)
          if [ -n "$EXT" ]; then echo "Running $EXT"; python3 "$EXT" boot.img || true; fi
          chmod +x *.sh 2>/dev/null || true
          export CLANG_DIR=$(realpath ../tc/clang10)
          export GCC_DIR=$(realpath ../tc/gcc49)
          export MODEL=g985f
          ./build.sh -m g985f || ./build.sh g985f || { head -n 45 build.sh; exit 1; }
          if [ -f ./mkzip.sh ]; then ./mkzip.sh -m g985f || ./mkzip.sh g985f || ./mkzip.sh; fi
          find . -maxdepth 3 -name "*.zip" -mmin -20 -exec cp -n {} . \; || true
      - uses: actions/upload-artifact@v4
        with:
          name: S20Plus_G985F_NoPeer50
          path: "*.zip"
